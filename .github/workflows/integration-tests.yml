name: Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Run SQLite integration tests
        run: python -m unittest integration_tests.test_api_integration

  mssql:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DataDictionary!234
        ports:
          - 14333:1433
        options: >-
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install pymssql
        run: pip install pymssql

      - name: Verify SQL Server connectivity
        run: |
          python -c "
          import pymssql, time, sys
          for i in range(30):
              try:
                  conn = pymssql.connect(server='127.0.0.1', port=14333, user='sa', password='DataDictionary!234')
                  conn.close()
                  print('SQL Server is ready')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {i+1}: {e}')
                  time.sleep(2)
          print('SQL Server never became ready')
          sys.exit(1)
          "

      - name: Run MSSQL integration tests
        env:
          RUN_MSSQL_TESTS: 'true'
          MSSQL_TEST_URL: mssql+pymssql://sa:DataDictionary!234@127.0.0.1:14333/data_dictionary_test
        run: python -m unittest integration_tests.test_api_integration -v 2>&1; echo "EXIT CODE: $?"