name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate deployment artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p deployment
          cat > deployment/docker-compose.prod.yml << 'EOF_YAML'
          services:
            data-dictionary:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
              container_name: data-dictionary
              ports:
                - "8000:8000"
              volumes:
                - ./data:/app/data
              environment:
                - PORT=8000
                - DATABASE=/app/data/dictionary.db
                - AUTH_DISABLED=false
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
          EOF_YAML

          cat > deployment/README.md << 'EOF_README'
          # Data Dictionary Deployment

          ## Quick Start

          1. Create a data directory:
             ```bash
             mkdir -p data
             ```

          2. Start the application:
             ```bash
             docker compose -f docker-compose.prod.yml up -d
             ```

          3. Access the application:
             - Public view: http://localhost:8000/
             - Admin view: http://localhost:8000/admin/
             - API: http://localhost:8000/api

          ## Stopping the Application

          ```bash
          docker compose -f docker-compose.prod.yml down
          ```

          ## Data Persistence

          The SQLite database is stored in the `./data` directory and
          persists between container restarts.

          ## Access Control

          Set AUTH_DISABLED=false and ADMIN_EMAILS to enable role-based
          access. See DEPLOYMENT.md for details.

          ## Image Tags

          - Latest stable: `${{ steps.meta.outputs.version }}`
          - Registry: `${{ env.REGISTRY }}`
          EOF_README

      - name: Upload deployment artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files
          path: deployment/
