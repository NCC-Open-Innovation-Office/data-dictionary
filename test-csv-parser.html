<!DOCTYPE html>
<html>
<head>
    <title>CSV Parser Test</title>
</head>
<body>
    <h1>CSV Parser Test</h1>
    <input type="file" id="fileInput" accept=".csv">
    <div id="output"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            const entries = parseCSV(text);
            
            document.getElementById('output').innerHTML = `
                <h2>Results:</h2>
                <p><strong>Total entries parsed:</strong> ${entries.length}</p>
                <h3>First 3 entries:</h3>
                <pre>${JSON.stringify(entries.slice(0, 3), null, 2)}</pre>
            `;
        });

        function parseCSV(text) {
            // Parse CSV properly handling quoted fields with newlines
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                
                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        // Escaped quote
                        currentField += '"';
                        i++; // Skip next quote
                    } else {
                        // Toggle quotes
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    // End of field
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    // End of row
                    if (currentField || currentRow.length > 0) {
                        currentRow.push(currentField.trim());
                        if (currentRow.some(field => field)) { // Only add non-empty rows
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    }
                    // Skip \r\n combination
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                } else if (char !== '\r') { // Skip standalone \r
                    currentField += char;
                }
            }
            
            // Add last field and row if exists
            if (currentField || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (currentRow.some(field => field)) {
                    rows.push(currentRow);
                }
            }
            
            if (rows.length < 2) return [];
            
            // First row is headers
            const headers = rows[0];
            const entries = [];
            
            // Map header positions
            const headerMap = {};
            headers.forEach((header, index) => {
                const normalized = header.toLowerCase().trim();
                headerMap[normalized] = index;
            });
            
            console.log('Header map:', headerMap);
            console.log('Total rows:', rows.length);
            
            // Parse data rows
            for (let i = 1; i < rows.length; i++) {
                const values = rows[i];
                
                const entry = {
                    term: values[headerMap['term']] || '',
                    definition: values[headerMap['definition']] || '',
                    abbreviation: values[headerMap['abbreviation']] || '',
                    dataType: values[headerMap['data type']] || '',
                    inputFormat: values[headerMap['input format']] || '',
                    variations: values[headerMap['variations']] || '',
                };
                
                // Only add if term exists
                if (entry.term && entry.term.trim()) {
                    entries.push(entry);
                }
            }
            
            return entries;
        }
    </script>
</body>
</html>
