# Production Docker Compose - single container
services:
  data-dictionary:
    image: ${NEXUS}:8082/data_dictionary:${VERSION:-latest}
    ports:
      - "8001:8000"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 20s
        order: start-first
    environment:
      - PORT=443
      - DATABASE_URL=mssql+pymssql://sully_rw:4YA8E-adW.k.Aei@scarefloor.admin.northampton.ede:1433/sully
      #- DATABASE=/app/data/dictionary.db
      # Set DATABASE_URL to use a SQLAlchemy connection URL instead of SQLite.
      # - DATABASE_URL=mssql+pymssql://username:password@sqlserver:1433/data_dictionary
      # Auth (set AUTH_DISABLED=false behind an authenticating proxy)
      - AUTH_DISABLED=false
      # - ADMIN_EMAILS=alice@ncc.edu,bob@ncc.edu
    secrets:
      - source: data-dictionary
        target: config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
