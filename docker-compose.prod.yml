# Production Docker Compose - single container
services:
  data-dictionary:
    image: ghcr.io/marshalmiller/data-dictionary:latest
    container_name: data-dictionary
    ports:
      - "8000:8000"
    volumes:
      # Persist database on host
      - ./data:/app/data
    environment:
      - PORT=8000
      - DATABASE=/app/data/dictionary.db
      # Set DATABASE_URL to use a SQLAlchemy connection URL instead of SQLite.
      # - DATABASE_URL=mssql+pymssql://username:password@sqlserver:1433/data_dictionary
      # Auth (set AUTH_DISABLED=false behind an authenticating proxy)
      - AUTH_DISABLED=false
      # Shared secret the proxy must present in X-Proxy-Secret. Without
      # it, anyone who can reach the container can set the SSOUSER
      # header and become an administrator. Set this.
      # - PROXY_SHARED_SECRET=change-me-to-a-long-random-value
      # - AUTH_TRUSTED_SECRET_HEADER=X-Proxy-Secret
      # - SSOUSER_HEADER=SSOUSER
      # Bootstrap / break-glass allow-lists. Users are otherwise managed
      # from Admin -> Manage Users.
      # - ADMIN_EMAILS=alice@ncc.edu,bob@ncc.edu
      # - VIEWER_EMAILS=carol@ncc.edu
      # - SSO_AUTO_PROVISION=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
