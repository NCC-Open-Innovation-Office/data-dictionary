# Production Docker Compose - single container
#
# This file is generic and safe to publish. Deployment-specific values
# (registry, host port, admin allow-list, database URL) come from the
# environment or from a local override file that is not tracked.
#
# Overrides:
#   - Put deployment values in a .env file next to this one, or
#   - Add an untracked docker-compose.prod.local.yml and run
#       docker compose -f docker-compose.prod.yml \
#                      -f docker-compose.prod.local.yml up -d
#
# See DEPLOYMENT.md for the full list of environment variables.
services:
  data_dictionary:
    image: ${IMAGE:-ghcr.io/ncc-open-innovation-office/data-dictionary:latest}
    ports:
      - "${HOST_PORT:-8000}:8000"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 20s
        order: start-first
    environment:
      - PORT=8000
      # Database. Set DATABASE_URL for MSSQL or PostgreSQL; otherwise
      # the app uses the SQLite file under /app/data.
      #   mssql+pymssql://<username>:<password>@<host>:1433/<database>
      #   postgresql+psycopg2://<username>:<password>@<host>:5432/<database>
      # - DATABASE_URL=${DATABASE_URL}
      # - DATABASE=/app/data/dictionary.db
      # Auth. Behind an authenticating proxy, set AUTH_DISABLED=false
      # and PROXY_SHARED_SECRET.
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      # The proxy sets the authenticated user's email in this header.
      # - SSOUSER_HEADER=SSOUSER
      # Shared secret the proxy must present. Without it, anyone who can
      # reach the container can set the SSOUSER header and become an
      # administrator. Set this in every real deployment.
      # - PROXY_SHARED_SECRET=change-me-to-a-long-random-value
      # - AUTH_TRUSTED_SECRET_HEADER=X-Proxy-Secret
      # Bootstrap / break-glass allow-lists. Users are otherwise managed
      # from Admin -> Manage Users.
      # - ADMIN_EMAILS=alice@ncc.edu,bob@ncc.edu
      # - VIEWER_EMAILS=carol@ncc.edu
      # - SSO_AUTO_PROVISION=true
    secrets:
      - source: data_dictionary
        target: config
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 40s

secrets:
  data_dictionary:
    external: true
