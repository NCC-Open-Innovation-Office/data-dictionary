# Development Docker Compose - single container
services:
  data-dictionary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-dictionary
    ports:
      - "8000:8000"
    volumes:
      # Persist database on host
      - ./data:/app/data
    environment:
      - PORT=8000
      - DATABASE=/app/data/dictionary.db
      # Set DATABASE_URL to use a SQLAlchemy connection URL instead of SQLite.
      # Example: mssql+pymssql://username:password@sqlserver:1433/data_dictionary
      # Example: postgresql+psycopg2://username:password@postgres:5432/data_dictionary
      # - DATABASE_URL=mssql+pymssql://username:password@sqlserver:1433/data_dictionary
      # Auth (set AUTH_DISABLED=false behind an authenticating proxy)
      - AUTH_DISABLED=true
      # - ADMIN_EMAILS=alice@ncc.edu,bob@ncc.edu
      # Set to 'true' to allow DD ID editing in admin panel (disabled by default for safety)
      # - ALLOW_DD_ID_EDIT=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Disposable SQL Server for integration testing. Activate with:
  #   docker compose --profile mssql-test up -d sqlserver
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: data-dictionary-sqlserver
    profiles:
      - mssql-test
    ports:
      - "14333:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=DataDictionary!234
    restart: unless-stopped

  # Disposable PostgreSQL for integration testing. Activate with:
  #   docker compose --profile postgres-test up -d postgres
  postgres:
    image: postgres:16
    container_name: data-dictionary-postgres
    profiles:
      - postgres-test
    ports:
      - "54320:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped
